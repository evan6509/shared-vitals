plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.14'
}

def releaseVersion = providers.environmentVariable('SHARED_VITALS_VERSION').getOrElse(project.mod_version)
if (!(releaseVersion ==~ /(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)/)) {
    throw new GradleException('SHARED_VITALS_VERSION must be a version such as 0.1.1')
}

version = "${releaseVersion}+mc${project.minecraft_version}"
group = 'com.evanchubbuck.sharedvitals'
base { archivesName = 'shared-vitals' }

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

java {
    withSourcesJar()
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

jar { from('LICENSE') }

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

loom {
    mods {
        shared_vitals { sourceSet sourceSets.main }
        shared_vitals_tests { sourceSet sourceSets.gametest }
    }
    runs {
        gametest {
            server()
            name 'Shared Vitals Game Tests'
            source sourceSets.gametest
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.get()}/gametest-results.xml"
            runDir 'build/gametest'
        }
    }
}
